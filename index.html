<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lời chúc lặng thầm</title>
    <style>
        /* --------------------------
           Cấu trúc cơ bản
        -------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            /* Nền tối, giảm sáng cây đào */
            background: linear-gradient(rgba(15, 25, 45, 0.82), rgba(8, 18, 38, 0.88)), 
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=55');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            color: #f8f8ff;
            position: relative;
        }

        /* --------------------------
           Khối hiển thị thời gian
        -------------------------- */
        .time-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 70px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 18px 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.5);
        }

        .clock-icon {
            font-size: 2.8rem;
            color: #ffdd77;
            filter: drop-shadow(0 0 8px rgba(255, 221, 119, 0.6));
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff8e6;
            text-shadow: 0 0 12px rgba(255, 200, 100, 0.7), 
                         2px 2px 6px rgba(0, 0, 0, 0.6);
            animation: soft-glow 4s ease-in-out infinite alternate;
        }

        @keyframes soft-glow {
            from { text-shadow: 0 0 10px rgba(255, 200, 100, 0.5), 2px 2px 6px rgba(0,0,0,0.6); }
            to   { text-shadow: 0 0 18px rgba(255, 200, 100, 0.8), 2px 2px 6px rgba(0,0,0,0.6); }
        }

        /* --------------------------
           Popup Lời nhắn
        -------------------------- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }

        .popup-box {
            background: linear-gradient(145deg, #1a2233, #0f1726);
            padding: 40px 35px;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: popup-show 0.5s ease forwards;
        }

        @keyframes popup-show {
            from { transform: scale(0.7); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .popup-title {
            font-size: 1.8rem;
            color: #ffd98e;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .popup-text {
            font-size: 1.2rem;
            color: #e2e8f0;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .btn-ok {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .btn-ok:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(99, 102, 241, 0.55);
        }

        /* Ẩn popup sau khi nhấn OK */
        .hidden {
            display: none;
        }

        /* --------------------------
           Nội dung chính sau mở popup
        -------------------------- */
        .content-box {
            max-width: 820px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            padding: 55px 45px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55);
            text-align: center;
            line-height: 1.9;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(20px);
            visibility: hidden;
        }

        .content-box.show {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
            animation: fade-up 0.6s ease forwards;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .wish-text {
            font-size: 2.1rem;
            font-weight: 600;
            margin-bottom: 45px;
            color: #ffecec;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.65);
            line-height: 1.7;
        }

        .feeling-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .sad-icon {
            font-size: 2.5rem;
            color: #a0aec0;
            opacity: 0.8;
            filter: drop-shadow(0 0 6px rgba(160, 174, 192, 0.4));
        }

        .feeling-text {
            font-size: 1.8rem;
            font-weight: 500;
            color: #e0e7ff;
            font-style: italic;
            letter-spacing: 0.8px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
        }

        /* Hiệu ứng nhấp nháy viền chữ From */
        .from-text {
            margin-top: 50px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #f0f4ff;
            padding: 8px 18px;
            display: inline-block;
            border-radius: 8px;
            animation: border-blink 2.5s ease-in-out infinite alternate;
        }

        @keyframes border-blink {
            from {
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.15);
            }
            to {
                border: 1px solid rgba(255, 220, 120, 0.55);
                box-shadow: 0 0 15px rgba(255, 220, 120, 0.4);
            }
        }

        .footer-note {
            margin-top: 60px;
            font-size: 1.05rem;
            color: rgba(220, 225, 240, 0.6);
            font-weight: 300;
            font-style: italic;
            text-align: center;
        }

        /* --------------------------
           Tương thích màn hình nhỏ
        -------------------------- */
        @media (max-width: 768px) {
            .time-container {
                gap: 12px;
                padding: 15px 22px;
                margin-bottom: 50px;
            }

            .clock-icon {
                font-size: 2.2rem;
            }

            .time-display {
                font-size: 2.6rem;
            }

            .popup-box {
                padding: 30px 25px;
            }

            .popup-title {
                font-size: 1.5rem;
            }

            .content-box {
                padding: 40px 28px;
            }

            .wish-text {
                font-size: 1.6rem;
                margin-bottom: 35px;
            }

            .feeling-text {
                font-size: 1.4rem;
            }

            .sad-icon {
                font-size: 2rem;
            }

            .from-text {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .time-container {
                padding: 12px 18px;
            }

            .clock-icon {
                font-size: 1.9rem;
            }

            .time-display {
                font-size: 2rem;
            }

            .content-box {
                padding: 30px 20px;
                border-radius: 18px;
            }

            .wish-text {
                font-size: 1.3rem;
            }

            .feeling-text {
                font-size: 1.15rem;
            }

            .sad-icon {
                font-size: 1.7rem;
            }

            .footer-note {
                margin-top: 40px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Khối hiển thị thời gian -->
    <div class="time-container">
        <div class="clock-icon">🕒</div>
        <div class="time-display">00:30 sáng</div>
    </div>

    <!-- Popup Lời nhắn nửa đêm -->
    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <h3 class="popup-title">📩 Lời nhắn nửa đêm</h3>
            <p class="popup-text">Mở ra để xem, ủng hộ tôi nhé ❤️</p>
            <button class="btn-ok" id="btnOpen">OK</button>
        </div>
    </div>

    <!-- Nội dung chính sẽ hiển thị sau nhấn OK -->
    <div class="content-box" id="mainContent">
        <p class="wish-text">
            Tôi chúc em hạnh phúc bên người em thương
        </p>
        <div class="feeling-row">
            <span class="sad-icon">😔</span>
            <p class="feeling-text">Tôi biết mà, tôi chỉ là kẻ thay thế</p>
        </div>
        <p class="from-text">From: Một người lặng lẽ</p>
    </div>

    <!-- Chân trang -->
    <div class="footer-note">
        Khoảnh khắc lặng lẽ, một chút nhớ, một lời chúc
    </div>

    <script>
        // Ẩn popup và hiển thị nội dung khi nhấn nút OK
        const popup = document.getElementById('popup');
        const mainContent = document.getElementById('mainContent');
        const btnOpen = document.getElementById('btnOpen');

        btnOpen.addEventListener('click', function() {
            popup.classList.add('hidden');
            mainContent.classList.add('show');
        });

        // Giữ giờ cố định 00:30 sáng
        const timeElement = document.querySelector('.time-display');
        timeElement.textContent = "00:30 sáng";
    </script>
</body>
</html>
